<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const site = 'https://randomuser.me/api/';
        let img = document.createElement('img');
        let username = document.createElement('div');
        let email = document.createElement('div');
        let phonenumber = document.createElement('div');
        let bttn = document.createElement('button');
        bttn.type = 'button';
        bttn.textContent = 'Click me';
        document.body.appendChild(img);
        document.body.appendChild(username);
        document.body.appendChild(email);
        document.body.appendChild(phonenumber);
        document.body.appendChild(bttn);
        const get = async()=>{
            try{
                let result = await fetch(site);
                result = await result.json();
                img.src = result.results[0].picture.large;
                img.alt = 'Picture of user';
                username.textContent = result.results[0].name.first;
                email.textContent = result.results[0].email;
                phonenumber.textContent = result.results[0].phone;
            }catch{(reason)=>console.log(reason);}
        }
        get();
        bttn.addEventListener('click', get);
    </script>
</body>
</html>
